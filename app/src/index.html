<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>MarketPOS</title>
    <base href="/" />
    <meta name="description" content="MarketPOS, logiciel de caisse et de gestion pour épiceries et supermarchés" />
    <meta name="theme-color" content="#0d1412" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // Apply the saved or system theme before the first paint, so the app never flashes the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem('marketpos.theme');
          var dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Activez JavaScript pour utiliser MarketPOS.</noscript>
  </body>
</html>
